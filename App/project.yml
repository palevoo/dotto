name: Dotto
options:
  bundleIdPrefix: works.dotto
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Core:
    path: ../Core

# Who signs, the prefix every id is made from, and the version: Config/Base.xcconfig, with
# your own team and prefix in Config/Signing.xcconfig beside it, which git ignores.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settingGroups:
  # A stamped target: Scripts/stamp.sh writes Stamp.h before the build, and Xcode reads it
  # as it makes the Info.plist, so DOTTO_COMMIT, DOTTO_CHANGED and DOTTO_BUILD in a plist
  # below become the commit, whether the tree had changes, and the build number. The
  # script reads git, which the script sandbox would refuse. -C keeps an address in a
  # plist whole, where the preprocessor would take // for a comment.
  stamped:
    INFOPLIST_PREPROCESS: true
    INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/Stamp.h
    INFOPLIST_OTHER_PREPROCESSOR_FLAGS: -C
    ENABLE_USER_SCRIPT_SANDBOXING: false
  signing:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Dotto:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Shared
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
      - target: DottoControls
      - target: DottoShare
    entitlements:
      path: iOS/Dotto.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # Pushes. Xcode turns this into production for TestFlight and the store on its own.
        aps-environment: development
    info:
      path: iOS/Sources/Info.plist
      properties:
        CFBundleDisplayName: Dotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: DOTTO_BUILD
        DottoCommit: DOTTO_COMMIT
        DottoChanged: DOTTO_CHANGED
        # The group the app and its share sheet keep things in for each other.
        DottoAppGroup: group.$(BUNDLE_PREFIX)
        # Only the system's own encryption is used, for connections and for hashes, so the
        # export question Apple asks of every upload is answered here once.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: To put a photo on the page.
        NSMicrophoneUsageDescription: To keep a voice note behind the words.
        NSSpeechRecognitionUsageDescription: To turn a voice note into words, on this device.
        NSLocationWhenInUseUsageDescription: To remember where a line was written. Named later, never asked.
        NSPhotoLibraryUsageDescription: To bring older photos onto the page, on the day they were taken.
        NSPhotoLibraryAddUsageDescription: To keep the photos you take here in Photos too.
        NSHealthShareUsageDescription: To put a walk on the page as a line, with its distance and time.
    preBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Stamp.h
        basedOnDependencyAnalysis: false
    settings:
      groups: [signing, stamped]
      base:
        PRODUCT_NAME: dotto
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Control Center, lock screen and Action button controls. Nothing but three buttons
  # that open the app; the intents they press live in iOS/Shared.
  DottoControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls/Sources
      - path: iOS/Shared
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Dotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: DOTTO_BUILD
        DottoCommit: DOTTO_COMMIT
        DottoChanged: DOTTO_CHANGED
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    preBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Stamp.h
        basedOnDependencyAnalysis: false
    settings:
      groups: [signing, stamped]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).app.controls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # The share sheet. Keeps what was shared in the app group; the app takes it into the
  # notebook next time it is open. Theme, photo code and the inbox live in iOS/Common.
  DottoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/Sources
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Dotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: DOTTO_BUILD
        DottoCommit: DOTTO_COMMIT
        DottoChanged: DOTTO_CHANGED
        DottoAppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: Share/Dotto.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
    preBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Stamp.h
        basedOnDependencyAnalysis: false
    settings:
      groups: [signing, stamped]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).app.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # The phone app driven as a thumb would, on a booted simulator, headless:
  # xcodebuild test -scheme Dotto -destination 'id=<simulator>'. The proof for what a tap,
  # a key and a paste do.
  DottoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Dotto
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).app.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Dotto

  DottoMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Assets.xcassets
    dependencies:
      - package: Core
        product: Core
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Dotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: DOTTO_BUILD
        DottoCommit: DOTTO_COMMIT
        DottoChanged: DOTTO_CHANGED
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # The team the push key belongs to, for the claim Apple checks.
        DottoTeamID: $(DEVELOPMENT_TEAM)
        # What is selected in another app, sent to the live line from that app's Services menu.
        NSServices:
          - NSMenuItem:
              default: Keep in Dotto
            NSMessage: keepInDotto
            NSPortName: $(PRODUCT_NAME)
            NSSendTypes:
              - NSStringPboardType
              - NSURLPboardType
              - NSTIFFPboardType
            NSSendFileTypes:
              - public.image
    # No sandbox: the app runs the claude command for the reader, which a sandboxed app may
    # not. It still touches only the folder you picked; that is the code's promise now.
    preBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Stamp.h
        basedOnDependencyAnalysis: false
    settings:
      groups: [signing, stamped]
      base:
        PRODUCT_NAME: Dotto
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false

  # dotto dev: the same Mac app under another identity, for trying a change without touching
  # the home or its notebook. Its own bundle id, so its own settings and keychain entries;
  # in code, Mac/Sources/Identity.swift gives it its own port, records folder and hotkey,
  # and keeps it from running loops. Signed to run on this Mac only, so building it from a
  # terminal asks for no certificate. Run it with `-dotto-folder <path>` to name its notebook.
  DottoMacDev:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Assets.xcassets
    dependencies:
      - package: Core
        product: Core
    info:
      path: Mac/Info-Dev.plist
      properties:
        CFBundleDisplayName: dotto dev
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: DOTTO_BUILD
        DottoCommit: DOTTO_COMMIT
        DottoChanged: DOTTO_CHANGED
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    preBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Stamp.h
        basedOnDependencyAnalysis: false
    settings:
      groups: [stamped]
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: dotto dev
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).mac.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false

schemes:
  # The phone app: run it, test it, archive it for TestFlight.
  Dotto:
    build:
      targets:
        Dotto: all
        DottoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DottoUITests
    archive:
      config: Release
  # The home: run it from Xcode, archive it for a release.
  DottoMac:
    build:
      targets:
        DottoMac: all
    run:
      config: Debug
    archive:
      config: Release
  # dotto dev from a terminal: xcodebuild build -scheme DottoMacDev
  DottoMacDev:
    build:
      targets:
        DottoMacDev: all
    run:
      config: Debug
