name: Margin
options:
  bundleIdPrefix: social.interface
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Core:
    path: ../Core

settingGroups:
  signing:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DX6JVUPRA4
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Shared
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
      - target: MarginControls
      - target: MarginShare
    entitlements:
      path: iOS/Margin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.social.interface.notebook
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # Pushes. Xcode turns this into production for TestFlight and the store on its own.
        aps-environment: development
    info:
      path: iOS/Sources/Info.plist
      properties:
        CFBundleDisplayName: dotto
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: To put a photo on the page.
        NSMicrophoneUsageDescription: To keep a voice note behind the words.
        NSSpeechRecognitionUsageDescription: To turn a voice note into words, on this device.
        NSLocationWhenInUseUsageDescription: To remember where a line was written. Named later, never asked.
        NSPhotoLibraryUsageDescription: To bring older photos onto the page, on the day they were taken.
        NSPhotoLibraryAddUsageDescription: To keep the photos you take here in Photos too.
        NSHealthShareUsageDescription: To put a walk on the page as a line, with its distance and time.
    postBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        # Reads git and writes the built Info.plist, which the script sandbox would refuse.
    settings:
      groups: [signing]
      base:
        # The app is called dotto. The bundle id is kept from the first install so the notebook
        # stored on the phone, the folder choice and the permissions stay; it changes only with a
        # deliberate migration once the registers are checked.
        PRODUCT_NAME: dotto
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Control Center, lock screen and Action button controls. Nothing but two buttons
  # that open the app; the intents they press live in iOS/Shared.
  MarginControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls/Sources
      - path: iOS/Shared
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: dotto
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook.controls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # The share sheet. Keeps what was shared in the app group; the app takes it into the
  # notebook next time it is open. Theme, photo code and the inbox live in iOS/Common.
  MarginShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/Sources
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: dotto
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: Share/Margin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.social.interface.notebook
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # The phone app driven as a thumb would, on a booted simulator, headless:
  # xcodebuild test -scheme Margin -destination 'id=<simulator>'. The proof for what a tap,
  # a key and a paste do.
  MarginUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Margin
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Margin

  MarginMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Assets.xcassets
    dependencies:
      - package: Core
        product: Core
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: dotto
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # The team the push key belongs to, for the claim Apple checks.
        MarginTeamID: $(DEVELOPMENT_TEAM)
        # What is selected in another app, sent to the live line from that app's Services menu.
        NSServices:
          - NSMenuItem:
              default: Keep in dotto
            NSMessage: keepInDotto
            NSPortName: dotto
            NSSendTypes:
              - NSStringPboardType
              - NSURLPboardType
              - NSTIFFPboardType
            NSSendFileTypes:
              - public.image
    # No sandbox: the app runs the claude command for the reader, which a sandboxed app may
    # not. It still touches only the folder you picked; that is the code's promise now.
    postBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        # Reads git and writes the built Info.plist, which the script sandbox would refuse.
    settings:
      groups: [signing]
      base:
        # The app is called dotto; the bundle id stays until the registers are checked and a
        # migration of the keychain and the folder choice is written, since a new id is a new app.
        PRODUCT_NAME: dotto
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.margin.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

  # dotto dev: the same Mac app under another identity, for trying a change without touching
  # the home or its notebook. Its own bundle id, so its own settings and keychain entries;
  # in code, Mac/Sources/Identity.swift gives it its own port, records folder and hotkey,
  # and keeps it from running loops. Signed to run on this Mac only, so building it from a
  # terminal asks for no certificate. Run it with `-dotto-folder <path>` to name its notebook.
  MarginMacDev:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Assets.xcassets
    dependencies:
      - package: Core
        product: Core
    info:
      path: Mac/Info-Dev.plist
      properties:
        CFBundleDisplayName: dotto dev
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    postBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: dotto dev
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.margin.mac.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

schemes:
  # dotto dev from a terminal: xcodebuild build -scheme MarginMacDev
  MarginMacDev:
    build:
      targets:
        MarginMacDev: all
    run:
      config: Debug
  Margin:
    build:
      targets:
        Margin: all
        MarginUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarginUITests
