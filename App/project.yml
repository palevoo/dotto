name: Margin
options:
  bundleIdPrefix: social.interface
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Core:
    path: ../Core

settingGroups:
  signing:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DX6JVUPRA4
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Shared
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
      - target: MarginControls
      - target: MarginShare
    entitlements:
      path: iOS/Margin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.social.interface.notebook
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # Pushes. Xcode turns this into production for TestFlight and the store on its own.
        aps-environment: development
    info:
      path: iOS/Sources/Info.plist
      properties:
        CFBundleDisplayName: Margin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: To put a photo on the page.
        NSMicrophoneUsageDescription: To keep a voice note behind the words.
        NSSpeechRecognitionUsageDescription: To turn a voice note into words, on this device.
        NSLocationWhenInUseUsageDescription: To remember where a line was written. Named later, never asked.
        NSPhotoLibraryUsageDescription: To bring older photos onto the page, on the day they were taken.
        NSHealthShareUsageDescription: To put a walk on the page as a line, with its distance and time.
    postBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        # Reads git and writes the built Info.plist, which the script sandbox would refuse.
    settings:
      groups: [signing]
      base:
        # Kept from the first install so the notebook stored on the phone stays reachable.
        # Changes to social.interface.margin once the notebook lives in iCloud Drive.
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Control Center, lock screen and Action button controls. Nothing but two buttons
  # that open the app; the intents they press live in iOS/Shared.
  MarginControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls/Sources
      - path: iOS/Shared
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Margin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook.controls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # The share sheet. Keeps what was shared in the app group; the app takes it into the
  # notebook next time it is open. Theme, photo code and the inbox live in iOS/Common.
  MarginShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/Sources
      - path: iOS/Common
    dependencies:
      - package: Core
        product: Core
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Margin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: Share/Margin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.social.interface.notebook
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.notebook.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  MarginMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
    dependencies:
      - package: Core
        product: Core
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Margin
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # The team the push key belongs to, for the claim Apple checks.
        MarginTeamID: $(DEVELOPMENT_TEAM)
    entitlements:
      path: Mac/Margin.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.server: true
        # To reach Apple's push servers.
        com.apple.security.network.client: true
    postBuildScripts:
      - name: Stamp Build
        path: Scripts/stamp.sh
        # Reads git and writes the built Info.plist, which the script sandbox would refuse.
    settings:
      groups: [signing]
      base:
        PRODUCT_NAME: Margin
        PRODUCT_BUNDLE_IDENTIFIER: social.interface.margin.mac
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

schemes:
  Margin:
    build:
      targets:
        Margin: all
    run:
      config: Debug
