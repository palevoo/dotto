function renderHome() {

  const miss = missing(), vw = W.works.filter(w => w.visit).length, oq = W.questions.filter(q => q.open).length;
  document.getElementById('now').innerHTML = `
    <p>${part()} ${MONTHS[today.getMonth()]}. Olive window open, round 2 on the next visit.</p>
    <p>Plant outside now: ${esc(kp.v)}.${tag(kp.prov)}<button class="lnk quiet" data-say="What else could we plant now, outside or inside?">what else?</button></p>
    ${miss ? `<p>${miss} numbers from the last visit still missing.<a class="lnk" href="#events">fill in</a></p>` : '<p>Everything from the last visit is filled in.</p>'}
    <p>${vw} works for the next visit.<a class="lnk" href="#works">see</a></p>
    <p>${oq} open questions.<a class="lnk" href="#questions">see</a></p>`;
  const n = { places: W.places.length, beings: W.beings.length, things: W.things.length, people: W.people.length, works: W.works.length, events: W.events.length, batches: W.batches.length, money: W.money.length, knowledge: W.knowledge.length, questions: oq, charter: '' };
  document.getElementById('index').innerHTML = Object.keys(PAGES).map(k => `<a href="#${k}">${PAGES[k][0]}<span>${n[k]}</span></a>`).join('');
}

/* ============ PAGES ============ */
function renderPage(k) {
  const [title, note] = PAGES[k];
  document.getElementById('page-title').textContent = title; document.getElementById('page-note').textContent = note;
  const top = document.getElementById('page-top'); top.innerHTML = ''; let html = '';
  if (k === 'places') { top.innerHTML = mapHtml(); html = W.places.map(p => row(esc(p.name), p.kind === 'planned' ? 'planned' : '', `<p>${esc(p.note)}</p>`)).join(''); }
  if (k === 'beings') html = W.beings.map(b => {
    const cnt = b.count == null ? '?' : (b.approx ? '~' : '') + b.count;
    const yields = (b.yields || []).map(y => `<p>${y.y} harvest, round ${y.r}: ${y.kg == null ? fillBox('e-harvest', { k: 'kg', unit: 'kg' }) : known(y.kg, 'kg')}</p>`).join('');
    const acts = [`<label class="up">add photos<input type="file" accept="image/*" multiple data-photos="${b.id}"></label>`];
    if (b.id === 'olives') acts.push(`<button class="lnk" data-split="1">split one tree out</button>`, `<button class="lnk" data-say="Kept 20 suckers from the pruning to root as new trees">propagate suckers</button>`);
    return row(esc(b.name) + (b.parent ? ' <span class="tag">in ' + esc(byId(W.beings, b.parent).name) + '</span>' : ''), cnt, `<p>${esc(b.species)} · ${esc(pname(b.place))}</p><p>${esc(b.note)}${tag(b.prov)}</p>${yields}${b.photos ? `<div class="thumbs">${b.photos.map(s => `<img src="${s}" alt="">`).join('')}</div>` : ''}<div class="acts">${acts.join('')}</div>`, { miss: b.count == null });
  }).join('');
  if (k === 'things') ['stock', 'equipment', 'infrastructure'].forEach(fl => { html += `<div class="group">${fl}</div>` + W.things.filter(t => t.flavour === fl).map(t => row(esc(t.name), t.qty == null ? '?' : t.qty + (t.unit ? ' ' + t.unit : ''), `<p>${esc(t.note)}${tag(t.prov)}</p>`, { miss: t.qty == null })).join(''); });
  if (k === 'people') html = W.people.map(p => row(esc(p.name), '', `<p>${esc(p.role)}</p>`)).join('');
  if (k === 'works') {
    const g = [['next visit', W.works.filter(w => w.visit)], ['later', W.works.filter(w => !w.visit)]];
    g.forEach(([lbl, ws]) => { html += `<div class="group">${lbl}</div>` + ws.map(w => row(esc(w.name) + (w.by ? tag('agent', 'proposed by the agent') : ''), w.status, workBody(w))).join(''); });
  }
  if (k === 'events') html = W.events.map(e => {
    const fills = (e.fill || []).map(f => (e.filled && e.filled[f.k]) ? `${f.label ? `<span class="u">${esc(f.label)}</span> ` : ''}${known(e.filled[f.k], f.unit)}` : fillBox(e.id, f)).join(' &nbsp; ');
    const open = (e.fill || []).some(f => !(e.filled && e.filled[f.k]));
    return row(esc(e.t), open ? 'fill' : '', `${fills ? `<p>${fills}</p>` : ''}${e.links ? `<p>touches: ${esc(e.links)}</p>` : ''}${e.photos ? `<p><label class="up">attach photos<input type="file" accept="image/*" multiple data-ephotos="${e.id}"></label></p>` : ''}${e.photoData ? `<div class="thumbs">${e.photoData.map(s => `<img src="${s}" alt="">`).join('')}</div>` : ''}`, { date: e.d, miss: open, open });
  }).join('');
  if (k === 'batches') html = W.batches.map(b => row(esc(b.name), b.qty == null ? '?' : b.qty + ' ' + b.unit, `<p>${esc(b.state)}</p>`, { miss: b.qty == null })).join('');
  if (k === 'money') { const tot = W.money.filter(m => m.kind === 'cost' && m.amt).reduce((a, m) => a + m.amt, 0); html = W.money.map(m => row(esc(m.what) + (m.kind === 'revenue' ? ' <span class="tag">revenue</span>' : ''), m.amt == null ? '?' : money(m.amt), `<p>${m.prov ? 'example figure' : m.amt == null ? 'amount still missing' : 'from the field'}</p>`, { date: m.d, miss: m.amt == null })).join('') + `<p class="body" style="padding-top:12px">Known costs so far: ${money(tot)}.</p>`; }
  if (k === 'knowledge') html = W.knowledge.map(x => row(esc(x.t), x.v == null ? '?' : '', `<p>${x.v == null ? 'not yet measured' : esc(x.v) + (x.unit ? ' ' + x.unit : '')}${tag(x.prov)}</p>${x.s ? `<p>${esc(x.s)}</p>` : ''}`, { miss: x.v == null })).join('');
  if (k === 'questions') { const o = W.questions.filter(q => q.open), c = W.questions.filter(q => !q.open); html = o.map(q => row(esc(q.t), '', `<p>Blocks ${esc(q.blocks)}.</p>`)).join('') + (c.length ? `<div class="group">answered</div>` + c.map(q => row(`<span class="tag">${esc(q.t)}</span>`, '', '')).join('') : ''); }
  if (k === 'charter') html = `<pre class="charter">${esc(W.charter)}</pre>`;
  document.getElementById('list').innerHTML = html;
  if (k === 'places') initMap();
}
function workBody(w) {
  let h = `<p>Next: ${esc(w.next)}</p><p>Goal: ${esc(w.goal)}</p>`;
  if (w.dims) {
    const ok = w.dims.w && w.dims.h;
    h += `<div class="dims">${ok ? known(w.dims.w + ' × ' + w.dims.h, 'm') : `<span class="fill"><input type="text" id="dw" placeholder="?" aria-label="width"><span class="u">×</span><input type="text" id="dh" placeholder="?" aria-label="height"><span class="u">m</span></span><button class="lnk quiet" id="dkeep">keep</button>`}</div>`;
    if (ok) { const a = w.dims.w * w.dims.h; h += `<p>${a.toFixed(1)} m² face. Render about ${Math.ceil(a * 1.1)} m², primer ${Math.ceil(a * 2 / 10)} L, paint ${Math.ceil(a * 4 / 10)} L for two coats both sides.${tag('assumed', 'assumed coverage')}</p>`; }
    h += `<p>To buy: ${w.base.join(', ')}. Have: ${w.have.join(', ')}.</p>`;
  }
  h += `<p><label class="up">add photos<input type="file" accept="image/*" multiple data-wphotos="${w.id}"></label></p>${w.photoData ? `<div class="thumbs">${w.photoData.map(s => `<img src="${s}" alt="">`).join('')}</div>` : ''}`;
  return h;
}

/* ============ MAP ============ */
let pins = [], mapImg = null;
try { pins = JSON.parse(localStorage.getItem('t055.pins') || '[]'); mapImg = localStorage.getItem('t055.map') || null; } catch (e) {}
function mapHtml() {
  let coords = ''; try { coords = localStorage.getItem('t055.coords') || ''; } catch (e) {}
  return `<div class="map" id="map">${mapImg ? `<img src="${mapImg}" alt="Plot screenshot">` : '<div class="hint">A satellite screenshot of the plot goes here. Tap to pin a tree, a wall, the well.</div>'}${pins.map((p, i) => `<div class="pin" style="left:${p.x * 100}%;top:${p.y * 100}%" data-n="${esc(p.name || 'pin ' + (i + 1))}"></div>`).join('')}</div>
    <div class="maprow"><label class="up">${mapImg ? 'replace screenshot' : 'add screenshot'}<input type="file" id="mapfile" accept="image/*"></label><input type="text" id="coords" value="${esc(coords)}" placeholder="lat, lon" aria-label="Plot coordinates">${pins.length ? `<button class="lnk quiet" id="clearpins">clear pins</button>` : ''}</div>
    ${pins.length ? `<div class="list">${pins.map((p, i) => `<details><summary><span>${esc(p.name || 'pin ' + (i + 1))}</span><span class="r">${(p.x * 100).toFixed(0)}, ${(p.y * 100).toFixed(0)}</span></summary><div class="body"><span class="fill"><input type="text" class="wide" data-pinname="${i}" value="${esc(p.name || '')}" placeholder="name it" aria-label="Pin name" style="text-align:left;border-bottom-style:solid;border-color:var(--line)"></span></div></details>`).join('')}</div>` : ''}`;
}
function initMap() {
  const m = document.getElementById('map');
  m.addEventListener('click', e => { const r = m.getBoundingClientRect(); pins.push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, name: '' }); save(); renderPage('places'); toast('Pinned. Name it below.'); });
  document.getElementById('mapfile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { mapImg = rd.result; try { localStorage.setItem('t055.map', mapImg); } catch (err) {} renderPage('places'); toast('Screenshot kept in this browser.'); }; rd.readAsDataURL(f); });
  document.getElementById('coords').addEventListener('change', e => { try { localStorage.setItem('t055.coords', e.target.value.trim()); } catch (err) {} toast('Coordinates kept.'); });
  const c = document.getElementById('clearpins'); if (c) c.addEventListener('click', () => { pins = []; save(); renderPage('places'); });
  document.querySelectorAll('[data-pinname]').forEach(i => i.addEventListener('change', () => { pins[+i.dataset.pinname].name = i.value; save(); renderPage('places'); }));
  function save() { try { localStorage.setItem('t055.pins', JSON.stringify(pins)); } catch (e) {} }
}

/* ============ FILL-INS ============ */
function applyFill(ownerId, k, v) {
  const e = byId(W.events, ownerId); if (!e) return; e.filled = e.filled || {}; e.filled[k] = v; const n = parseFloat(v);
  if (ownerId === 'e-harvest') { byId(W.beings, 'olives').yields[0].kg = n; byId(W.batches, 'b1').qty = n; byId(W.batches, 'b1').state = 'weighed, mill to fill'; closeQ('q-kg'); }
  if (ownerId === 'e-crates') { byId(W.money, 'm-crates').amt = n; closeQ('q-crates'); }
  if (ownerId === 'e-well') { const kn = byId(W.knowledge, 'k-well'); kn.v = v; closeQ('q-well'); byId(W.works, 'w-water').next = `Well gives ${v} L/h. Size a drip line for the upper grove from that.`; }
  if (ownerId === 'e-water' && k === 'n') { byId(W.beings, 'olives-dry').count = n; closeQ('q-dry'); }
  if (ownerId === 'e-house') { closeQ('q-house'); byId(W.works, 'w-house').next = `Measured ${v} m. Room by room photos next visit.`; }
}

/* ============ COMPOSER ============ */
const EX = [
  { say: 'Harvest round 1 was 180 kg, pressed at the mill in the village', reply: 'Logged. The first batch has a weight now. Litres come when the mill tells you.',
    atoms: [['upd', 'event', 'Olive harvest, round 1 · 180 kg'], ['upd', 'batch', 'Olives 2026, round 1 · 180 kg, at the village mill'], ['upd', 'person', 'Village mill'], ['close', 'question', 'How many kg in round 1?'], ['new', 'question', 'How many litres came back, and the fee?']],
    apply() { applyFill('e-harvest', 'kg', '180'); byId(W.batches, 'b1').state = 'at the village mill'; byId(W.people, 'mill').name = 'Village mill'; byId(W.people, 'mill').role = 'presses the olives. Fee?'; W.questions.push({ id: 'q-oil', t: 'How many litres came back from the mill, and at what fee?', blocks: 'the oil batch, the ledger', open: true }); } },
  { say: 'Well gives about 600 litres an hour, measured with a bucket', reply: 'Kept. Enough for a drip line on the upper grove. The water work has a next step now.',
    atoms: [['upd', 'knowledge', 'Well throughput · 600 L/h'], ['upd', 'event', 'Measured the well · 600 L/h'], ['close', 'question', 'What was the well throughput?'], ['upd', 'work', 'Water to the upper grove · size a drip line']],
    apply() { applyFill('e-well', 'lh', '600'); } },
  { say: 'Wall is 6.2 by 2.1 metres, render outside and paint both sides', reply: 'Measured. Quantities are derived in the work, marked assumed until you read the tin.',
    atoms: [['upd', 'work', 'Entrance wall · 6.2 × 2.1 m'], ['new', 'event', 'Entrance wall measured'], ['close', 'question', 'Wall dimensions?']],
    apply() { const w = byId(W.works, 'w-wall'); w.dims = { w: 6.2, h: 2.1 }; w.next = 'Buy materials before the visit.'; closeQ('q-wall'); addEvent({ d: iso(), t: 'Entrance wall measured, 6.2 × 2.1 m.' }); } },
  { say: 'Kept 20 suckers from the pruning to root as new trees', reply: 'A new being, child of the grove. One thing to check first: if the old trees are grafted, suckers from below the graft are rootstock, not the fruiting variety. A look at the base of a trunk answers it.',
    atoms: [['new', 'being', 'Olive cuttings 2026 · 20, in pots'], ['new', 'event', 'Took 20 suckers during pruning'], ['new', 'work', 'Root the cuttings · pot, shade, keep moist'], ['new', 'knowledge', 'Rooting olive suckers'], ['new', 'question', 'Are the old olives grafted or own-rooted?']],
    apply() { W.beings.push({ id: 'cuttings', name: 'Olive cuttings 2026', species: 'Olea europaea, from the grove', count: 20, place: 'house', parent: 'olives', note: 'Suckers taken during pruning. In pots.' }); addEvent({ d: iso(), t: 'Took 20 suckers from the pruning to root as new trees.' }); W.works.push({ id: 'w-cut', name: 'Root the cuttings', status: 'in progress', goal: '20 new trees by 2028', visit: true, next: 'Pot, shade, keep moist. Check for roots in spring.' }); W.knowledge.push({ id: 'k-suck', t: 'Rooting olive suckers', v: 'take with some root attached, autumn or spring, shade, keep moist', s: 'Suckers from below a graft are rootstock, not the fruiting variety.' }); W.questions.push({ id: 'q-graft', t: 'Are the old olives grafted or own-rooted?', blocks: 'whether the cuttings are true to type', open: true }); } },
  { say: 'What else could we plant now, outside or inside?', learn: true, reply: 'Late October, region unset, so this is the generic Mediterranean answer. Pick any and it becomes a work for the next visit.',
    options: [['Peas, outside', 'sow direct, harvest in spring'], ['Onion and shallot sets, outside', 'overwinter, harvest early summer'], ['Chard and spinach under fleece', 'cut and come again through winter'], ['A lemon and a pomegranate, bare root', 'planting season starts now, lemon wants shelter'], ['Lettuce, rocket, coriander under cover', 'fast, in a cold frame'], ['Ginger in pots, from February', 'experiment, noted for then']] },
  { say: 'Watered the 4 dried-out olives at the top, about 30 litres each', reply: 'Four trees are a tagged group inside the grove now, with their own history.',
    atoms: [['upd', 'being', 'Dried-out olives · 4'], ['upd', 'event', 'Watered · 4 trees, 30 L each'], ['close', 'question', 'How many olives dried out?']],
    apply() { applyFill('e-water', 'n', '4'); applyFill('e-water', 'l', '30'); } },
];
function renderTry() { document.getElementById('try').innerHTML = 'try: ' + EX.map((e, i) => `<button type="button" data-ex="${i}">${esc(e.say.split(',')[0].toLowerCase())}</button>`).join(' · '); }
function preview(i) {
  const ex = EX[i], pv = document.getElementById('preview'); pv.hidden = false;
  if (ex.learn) {
    pv.innerHTML = `<p class="said">${esc(ex.say)}</p><p class="reply">${esc(ex.reply)}</p><ul class="options">${ex.options.map((o, j) => `<li><span>${esc(o[0])}<small>${esc(o[1])}</small></span><button class="lnk" data-opt="${j}">add</button></li>`).join('')}</ul><div class="acts"><button class="lnk quiet" id="pvclose">done</button></div>`;
    pv.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { const o = ex.options[+b.dataset.opt]; W.works.push({ id: 'w' + Math.random().toString(36).slice(2, 6), name: 'Plant: ' + o[0], status: 'planned', goal: o[1], visit: true, next: o[1] }); W.knowledge.push({ id: 'k' + Math.random().toString(36).slice(2, 6), t: o[0], v: o[1], prov: 'assumed', s: 'From a planting conversation, region unset.' }); b.disabled = true; b.textContent = 'added'; refresh(); }));
  } else {
    pv.innerHTML = `<p class="said">${esc(ex.say)}</p><p class="reply">${esc(ex.reply)}</p><ul class="atoms">${ex.atoms.map(a => `<li><span class="op ${a[0]}">${a[0] === 'new' ? '+' : a[0] === 'upd' ? '~' : '✓'}</span><span class="ty">${a[1]}</span><span>${esc(a[2])}</span></li>`).join('')}</ul><div class="acts"><button class="lnk" id="pvkeep">keep</button><button class="lnk quiet" id="pvclose">not that</button></div>`;
    document.getElementById('pvkeep').addEventListener('click', () => { if (!ex.applied) { ex.apply(); ex.applied = true; } pv.hidden = true; document.getElementById('say').value = ''; refresh(); toast('Kept.'); });
  }
  document.getElementById('pvclose').addEventListener('click', () => { pv.hidden = true; document.getElementById('say').value = ''; });
}
function send() {
  const v = document.getElementById('say').value.trim(); if (!v) return;
  const i = EX.findIndex(e => e.say.toLowerCase() === v.toLowerCase()); if (i >= 0) { preview(i); return; }
  const pv = document.getElementById('preview'); pv.hidden = false;
  pv.innerHTML = `<p class="said">${esc(v)}</p><p class="reply hint">In the real system this goes to the agent, which reads it against the world and comes back with the atoms it would touch. The mock only knows the lines under "try".</p><div class="acts"><button class="lnk quiet" id="pvclose">ok</button></div>`;
  document.getElementById('pvclose').addEventListener('click', () => { pv.hidden = true; });
}

/* ============ ROUTING, EVENTS ============ */
let page = null;
function route() {
  const h = location.hash.replace('#', '');
  page = PAGES[h] ? h : null;
  document.getElementById('home-now').hidden = !!page; document.getElementById('home-index').hidden = !!page; document.getElementById('page').hidden = !page;
  refresh();
  if (page) window.scrollTo({ top: 0 });
}
function refresh() { if (page) renderPage(page); else renderHome(); }
document.addEventListener('click', e => {
  const ex = e.target.closest('[data-ex]'); if (ex) { document.getElementById('say').value = EX[+ex.dataset.ex].say; preview(+ex.dataset.ex); return; }
  const say = e.target.closest('[data-say]'); if (say) { document.getElementById('say').value = say.dataset.say; const i = EX.findIndex(x => x.say === say.dataset.say); if (i >= 0) preview(i); if (page) { location.hash = 'now'; } window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (e.target.closest('[data-split]')) { const n = W.beings.filter(b => b.tag).length + 1; W.beings.push({ id: 'ot' + n, name: 'Olive, tagged #' + n, species: 'Olea europaea', count: 1, place: 'grove', parent: 'olives', tag: true, note: 'Split out of the grove. Say why: disease, size, a photo.' }); refresh(); toast('One tree split out.'); return; }
  if (e.target.id === 'dkeep') { const a = parseFloat(document.getElementById('dw').value), b = parseFloat(document.getElementById('dh').value); if (!(a > 0 && b > 0)) { toast('Both numbers, in metres.'); return; } const w = byId(W.works, 'w-wall'); w.dims = { w: a, h: b }; w.next = 'Buy materials before the visit.'; closeQ('q-wall'); addEvent({ d: iso(), t: `Entrance wall measured, ${a} × ${b} m.` }); refresh(); toast('Kept. Materials derived.'); }
});
document.addEventListener('keydown', e => {
  const f = e.target.closest('[data-fill]'); if (f && e.key === 'Enter') { e.preventDefault(); const v = f.value.trim(); if (!v) return; applyFill(f.dataset.fill, f.dataset.key, v); refresh(); toast('Kept.'); }
});
document.addEventListener('change', e => {
  const rd = (files, max) => Promise.all(Array.from(files).slice(0, max).map(f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); })));
  const b = e.target.closest('[data-photos]'); if (b) rd(b.files, 4).then(d => { byId(W.beings, b.dataset.photos).photos = d; refresh(); toast('Photos attached, this browser only.'); });
  const w = e.target.closest('[data-wphotos]'); if (w) rd(w.files, 6).then(d => { byId(W.works, w.dataset.wphotos).photoData = d; refresh(); toast('Photos attached.'); });
  const ev = e.target.closest('[data-ephotos]'); if (ev) rd(ev.files, 6).then(d => { byId(W.events, ev.dataset.ephotos).photoData = d; refresh(); toast('Photos attached.'); });
});
document.getElementById('send').addEventListener('click', send);
document.getElementById('say').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
window.addEventListener('hashchange', route);
document.getElementById('when').textContent = `${part()} ${MONTHS[today.getMonth()]} ${today.getFullYear()}`;
renderTry(); route();
</script>
