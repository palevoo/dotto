<title>terreno 0.55 page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one continuous page of days, the date pinned on top, the page itself is the composer. */
:root {
  --bg: #F3F4F0;
  --paper: #FBFBF8;
  --line: #E2E4DD;
  --fg: #1F231D;
  --muted: #666C65;
  --faint: #C3C8BE;
  --accent: #3B5A2A;
  --agent: #5B4A66;
  --photo: #DDE2D6;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1E19; --paper: #22261F; --line: #343A31; --fg: #E6E9E1; --muted: #A2A89C; --faint: #4A5146;
    --accent: #9BBD86; --agent: #BBA9C8; --photo: #2E3429; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1E19; --paper: #22261F; --line: #343A31; --fg: #E6E9E1; --muted: #A2A89C; --faint: #4A5146;
  --accent: #9BBD86; --agent: #BBA9C8; --photo: #2E3429; color-scheme: dark;
}
html { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.sq { border-radius: var(--r); corner-shape: squircle; overflow: hidden; }

/* pinned header */
#pin { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
#pinbtn { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 14px 10px; text-align: left; border-bottom: 1px solid var(--line); }
#pindate { font-family: var(--serif); font-size: 22px; font-weight: 500; line-height: 1.2; }
#pinplace { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

/* calendar */
#cal { background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
#cal[hidden] { display: none; }
.calhead { display: flex; justify-content: space-between; align-items: baseline; }
#calmonth { font-family: var(--serif); font-size: 20px; font-weight: 500; }
.calnav { display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.dow { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-bottom: 4px; }
.day { height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.day .n { font-family: var(--mono); font-size: 14px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; corner-shape: squircle; font-variant-numeric: tabular-nums; }
.day.future .n { color: var(--muted); }
.day.today .n { background: var(--fg); color: var(--bg); }
.day .dot { width: 4px; height: 4px; border-radius: 2px; background: transparent; }
.day.has .dot { background: var(--accent); }
.calfoot { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.calfoot button { text-decoration: underline; text-underline-offset: 3px; }

/* page */
#page { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 8px 120px; display: flex; flex-direction: column; }
.daysec { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 28px; }
.daysec + .daysec { border-top: 1px solid var(--line); }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dayhead .d { font-family: var(--serif); font-size: 22px; font-weight: 500; }
.dayhead .p { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.entry { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
.entry .t { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.entry .b { font-family: var(--serif); font-size: 18px; line-height: 1.45; min-height: 1.45em; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .b:focus { outline: none; }
.media { display: flex; flex-direction: column; gap: 8px; }
.media .pic { max-width: 100%; aspect-ratio: 4 / 3; background: var(--photo); display: block; }
.media .pic img, .media .pic video { width: 100%; height: 100%; object-fit: cover; display: block; }
.media audio { width: 100%; }
.media .cap { font-family: var(--serif); font-size: 18px; line-height: 1.45; min-height: 1.45em; white-space: pre-wrap; overflow-wrap: anywhere; }
.media .cap:empty:not(:focus)::before { content: "a line, or none"; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.media .cap:focus { outline: none; }

/* the live line */
.live { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: start; }
.live .b:empty:not(:focus)::before { content: ""; display: inline-block; width: 2px; height: 1.1em; vertical-align: -0.15em; background: var(--fg); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .live .b:empty:not(:focus)::before { animation: none; } }
.marks { display: flex; gap: 2px; margin-top: -8px; }
.marks button, #strip button { padding: 10px; color: var(--muted); display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; }
.marks svg, #strip svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
body.typing .marks { visibility: hidden; }

/* strip above the keyboard */
#strip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); display: none; align-items: center; gap: 2px; padding-left: calc(var(--gutter-l) - 10px); padding-right: var(--gutter-r); padding-bottom: env(safe-area-inset-bottom, 0px); }
body.typing #strip { display: flex; }
#done { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--accent); padding-inline: 14px; }
.hint { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-left: 56px; }
#note { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; text-align: center; padding: 12px var(--gutter-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--paper); border-top: 1px solid var(--line); }
#note[hidden] { display: none; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>

<header id="pin">
  <button id="pinbtn" type="button" aria-expanded="false" aria-controls="cal">
    <span id="pindate">Today</span>
    <span id="pinplace"></span>
  </button>
  <div id="cal" hidden>
    <div class="calhead">
      <div id="calmonth">November</div>
      <div class="calnav"><button type="button" id="calprev">‹ earlier</button><button type="button" id="calnext">later ›</button></div>
    </div>
    <div class="calgrid" id="calgrid"></div>
    <div class="calfoot"><span>dot: a day with entries</span><button type="button" id="clearsample">remove sample entries</button></div>
  </div>
</header>

<main id="page"></main>

<div id="strip">
  <button type="button" id="s-cam" aria-label="Photo, hold for video"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button type="button" id="s-mic" aria-label="Audio"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button type="button" id="done">done</button>
</div>
<div id="note" hidden></div>

<input type="file" id="f-photo" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
<input type="file" id="f-video" accept="video/*" capture="user" aria-hidden="true" tabindex="-1">
<input type="file" id="f-audio" accept="audio/*" aria-hidden="true" tabindex="-1">

<script>
(function () {
  var KEY = 'terreno.page.v1';
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function T(y, m, d, h, mi) { return new Date(y, m - 1, d, h, mi).getTime(); }
  var SAMPLE = [
    { ts: T(2026,10,17,10,40), place: 'terreno 0.55', text: 'Harvest day. 90 kg from the upper rows, two of us, one day. The mill gave back 12 litres.', pic: true },
    { ts: T(2026,10,17,13,10), place: 'terreno 0.55', text: 'Ten crates.' },
    { ts: T(2026,10,17,16,20), place: 'terreno 0.55', text: 'Mulched the figs and the apples. The pile at the entrance barely noticed.' },
    { ts: T(2026,10,29,18,40), place: 'at home', text: 'Measure the wall to purchase the materials for the repairs.' },
    { ts: T(2026,10,30,8,40), place: 'terreno 0.55', text: 'Wall at the entrance. 6.2 long, 2.1 high, about 30 thick. Top course loose on the road side.', pic: true },
    { ts: T(2026,10,30,9,12), place: 'terreno 0.55', text: 'Tree 17 before pruning, suckers all round the base.', pic: true },
    { ts: T(2026,10,30,10,30), place: 'terreno 0.55', text: 'Mulch on 3, 5, 6, 9 and the whole upper row. Pile at the entrance about half gone.' },
    { ts: T(2026,10,30,11,5), place: 'terreno 0.55', text: 'Tree 17 done. Kept six suckers with roots.' },
    { ts: T(2026,10,30,12,20), place: 'terreno 0.55', text: 'Well: a 10 litre bucket in 58 seconds.' },
    { ts: T(2026,10,30,13,0), place: 'terreno 0.55', text: 'Eight pads cut from the big cactus by the gate. Drying on the porch.' },
    { ts: T(2026,11,1,16,50), place: 'at home', text: 'Rain all afternoon. The tanks are still not cleaned.' },
    { ts: T(2026,11,2,9,20), place: 'at home', text: 'Read the chapter on the three sisters. Maize, beans, squash together. Could try it in the lower bed.' },
    { ts: T(2026,11,2,11,5), place: 'at home', text: 'Pots arrived. 24 terracotta, €38.', pic: true },
    { ts: T(2026,11,2,14,30), place: 'at home', text: 'Ask Rui whether the old cart wheel can be rebuilt or only replaced.' }
  ];

  var entries = [];
  var blobs = {};
  var uid = 1;

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try { entries = JSON.parse(raw) || []; } catch (e) { entries = []; }
    }
    if (!raw) {
      entries = SAMPLE.map(function (s) { return { id: 's' + (uid++), ts: s.ts, text: s.text, place: s.place, pic: !!s.pic, sample: true }; });
      save();
    }
    entries.forEach(function (e) { var n = parseInt(String(e.id).replace(/^\D+/, ''), 10); if (n >= uid) uid = n + 1; });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) { note('could not keep this on the device'); }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hhmm(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function longDate(key) { var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function todayKey() { return dkey(Date.now()); }

  var page = document.getElementById('page');
  var pindate = document.getElementById('pindate');
  var pinplace = document.getElementById('pinplace');

  function svg(path) { return '<svg aria-hidden="true" viewBox="0 0 24 24">' + path + '</svg>'; }
  var CAM = svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>');
  var MIC = svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>');

  function render() {
    var byDay = {};
    var keys = [];
    entries.slice().sort(function (a, b) { return a.ts - b.ts; }).forEach(function (e) {
      var k = dkey(e.ts);
      if (!byDay[k]) { byDay[k] = []; keys.push(k); }
      byDay[k].push(e);
    });
    var tk = todayKey();
    if (!byDay[tk]) { byDay[tk] = []; keys.push(tk); }
    keys.sort();
    page.innerHTML = '';
    keys.forEach(function (k) {
      var sec = document.createElement('section');
      sec.className = 'daysec';
      sec.dataset.day = k;
      var place = '';
      byDay[k].forEach(function (e) { if (!place && e.place) place = e.place; });
      sec.dataset.place = place;
      var head = document.createElement('div');
      head.className = 'dayhead';
      head.innerHTML = '<span class="d">' + longDate(k) + (k === tk ? '' : '') + '</span><span class="p">' + (k === tk ? 'today' : '') + (k === tk && place ? ' · ' : '') + esc(place) + '</span>';
      sec.appendChild(head);
      byDay[k].forEach(function (e) { sec.appendChild(entryEl(e)); });
      if (k === tk) sec.appendChild(liveEl());
      page.appendChild(sec);
    });
    updatePin();
  }

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function entryEl(e) {
    var art = document.createElement('article');
    art.className = 'entry';
    art.dataset.id = e.id;
    var t = document.createElement('div'); t.className = 't'; t.textContent = hhmm(e.ts);
    art.appendChild(t);
    var hasMedia = e.pic || e.img || e.kind;
    if (hasMedia) {
      var m = document.createElement('div'); m.className = 'media';
      if (e.kind === 'audio' && blobs[e.id]) {
        var au = document.createElement('audio'); au.controls = true; au.src = blobs[e.id]; m.appendChild(au);
      } else {
        var pic = document.createElement('div'); pic.className = 'pic sq';
        if (e.img) { var im = document.createElement('img'); im.src = e.img; im.alt = e.text || 'photo'; pic.appendChild(im); }
        else if (e.kind === 'video' && blobs[e.id]) { var v = document.createElement('video'); v.controls = true; v.playsInline = true; v.src = blobs[e.id]; pic.appendChild(v); }
        m.appendChild(pic);
      }
      var cap = document.createElement('div'); cap.className = 'cap'; cap.contentEditable = 'true'; cap.setAttribute('aria-label', 'Caption'); cap.textContent = e.text || '';
      wireEdit(cap, e);
      m.appendChild(cap);
      art.appendChild(m);
    } else {
      var b = document.createElement('div'); b.className = 'b'; b.contentEditable = 'true'; b.setAttribute('aria-label', 'Entry'); b.textContent = e.text || '';
      wireEdit(b, e);
      art.appendChild(b);
    }
    return art;
  }

  function wireEdit(el, e) {
    el.addEventListener('focus', function () { document.body.classList.add('typing'); placeStrip(); });
    el.addEventListener('blur', function () {
      document.body.classList.remove('typing');
      var txt = el.innerText.replace(/\n{3,}/g, '\n\n').trim();
      if (txt !== (e.text || '')) {
        if (!txt && !(e.img || e.kind || e.pic)) { entries = entries.filter(function (x) { return x.id !== e.id; }); save(); render(); return; }
        e.text = txt; e.sample = false; save();
      }
    });
  }

  function liveEl() {
    var art = document.createElement('article');
    art.className = 'entry live';
    art.id = 'live';
    var t = document.createElement('div'); t.className = 't'; t.id = 'livetime';
    var b = document.createElement('div'); b.className = 'b'; b.id = 'livebody'; b.contentEditable = 'true'; b.setAttribute('aria-label', 'New entry'); b.setAttribute('enterkeyhint', 'enter');
    var marks = document.createElement('div'); marks.className = 'marks';
    marks.innerHTML = '<button type="button" id="m-cam" aria-label="Photo, hold for video">' + CAM + '</button><button type="button" id="m-mic" aria-label="Audio">' + MIC + '</button>';
    art.appendChild(t); art.appendChild(b); art.appendChild(marks);

    var started = 0;
    b.addEventListener('focus', function () {
      document.body.classList.add('typing'); placeStrip();
      setTimeout(function () { art.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, 250);
    });
    b.addEventListener('input', function () {
      if (!started && b.innerText.trim()) { started = Date.now(); t.textContent = hhmm(started); }
      if (started && !b.innerText.trim()) { started = 0; t.textContent = ''; }
    });
    b.addEventListener('blur', function () {
      document.body.classList.remove('typing');
      var txt = b.innerText.replace(/\n{3,}/g, '\n\n').trim();
      if (txt) {
        entries.push({ id: 'e' + (uid++), ts: started || Date.now(), text: txt });
        save(); render();
      } else { started = 0; t.textContent = ''; b.textContent = ''; }
    });
    holdButton(marks.querySelector('#m-cam'), takePhoto, takeVideo);
    marks.querySelector('#m-mic').addEventListener('click', takeAudio);
    return art;
  }

  function holdButton(btn, tap, hold) {
    var timer = null, held = false;
    btn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); held = false; timer = setTimeout(function () { held = true; note('release for a video'); }, 450); });
    function up(ev) {
      if (timer === null) return;
      clearTimeout(timer); timer = null;
      if (ev.type === 'pointerup') { if (held) hold(); else tap(); }
    }
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  }

  var fPhoto = document.getElementById('f-photo'), fVideo = document.getElementById('f-video'), fAudio = document.getElementById('f-audio');
  function takePhoto() { fPhoto.value = ''; fPhoto.click(); }
  function takeVideo() { fVideo.value = ''; fVideo.click(); }
  function takeAudio() { fAudio.value = ''; fAudio.click(); }

  fPhoto.addEventListener('change', function () {
    var f = fPhoto.files && fPhoto.files[0]; if (!f) return;
    var ts = Date.now();
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL('image/jpeg', 0.78);
      URL.revokeObjectURL(url);
      entries.push({ id: 'e' + (uid++), ts: ts, text: '', img: data });
      save(); render(); toBottom();
    };
    img.onerror = function () { note('that photo could not be read'); };
    img.src = url;
  });
  fVideo.addEventListener('change', function () {
    var f = fVideo.files && fVideo.files[0]; if (!f) return;
    var id = 'e' + (uid++);
    blobs[id] = URL.createObjectURL(f);
    entries.push({ id: id, ts: Date.now(), text: '', kind: 'video' });
    save(); render(); toBottom(); note('video kept for this session only');
  });
  fAudio.addEventListener('change', function () {
    var f = fAudio.files && fAudio.files[0]; if (!f) return;
    var id = 'e' + (uid++);
    blobs[id] = URL.createObjectURL(f);
    entries.push({ id: id, ts: Date.now(), text: '', kind: 'audio' });
    save(); render(); toBottom(); note('audio kept for this session only');
  });

  function toBottom() { setTimeout(function () { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }); }, 50); }

  var noteEl = document.getElementById('note'), noteTimer = null;
  function note(msg) {
    noteEl.textContent = msg; noteEl.hidden = false;
    clearTimeout(noteTimer); noteTimer = setTimeout(function () { noteEl.hidden = true; }, 2200);
  }

  /* strip */
  var strip = document.getElementById('strip');
  function placeStrip() {
    var vv = window.visualViewport;
    if (!vv) { strip.style.transform = ''; return; }
    var off = vv.offsetTop + vv.height - window.innerHeight;
    strip.style.transform = 'translateY(' + off + 'px)';
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', placeStrip); window.visualViewport.addEventListener('scroll', placeStrip); }
  function keepFocus(ev) { ev.preventDefault(); }
  holdButton(document.getElementById('s-cam'), takePhoto, takeVideo);
  document.getElementById('s-mic').addEventListener('pointerdown', keepFocus);
  document.getElementById('s-mic').addEventListener('click', takeAudio);
  document.getElementById('done').addEventListener('pointerdown', keepFocus);
  document.getElementById('done').addEventListener('click', function () { var a = document.activeElement; if (a && a.blur) a.blur(); });

  /* pinned header */
  function updatePin() {
    var secs = page.querySelectorAll('.daysec');
    var top = document.getElementById('pin').getBoundingClientRect().bottom + 1;
    var cur = null;
    for (var i = 0; i < secs.length; i++) { if (secs[i].getBoundingClientRect().top <= top) cur = secs[i]; }
    if (!cur) cur = secs[0];
    if (!cur) return;
    var k = cur.dataset.day;
    pindate.textContent = longDate(k);
    var isToday = k === todayKey();
    pinplace.textContent = (isToday ? 'today' : '') + (isToday && cur.dataset.place ? ' · ' : '') + (cur.dataset.place || '');
  }
  window.addEventListener('scroll', updatePin, { passive: true });

  /* calendar */
  var cal = document.getElementById('cal'), pinbtn = document.getElementById('pinbtn');
  var view = new Date(); view.setDate(1);
  pinbtn.addEventListener('click', function () {
    var open = cal.hidden;
    cal.hidden = !open;
    pinbtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      var secs = page.querySelectorAll('.daysec'); var top = document.getElementById('pin').getBoundingClientRect().bottom + 1; var cur = null;
      for (var i = 0; i < secs.length; i++) { if (secs[i].getBoundingClientRect().top <= top) cur = secs[i]; }
      if (cur) { var p = cur.dataset.day.split('-'); view = new Date(+p[0], +p[1] - 1, 1); }
      drawCal();
    }
  });
  document.getElementById('calprev').addEventListener('click', function () { view.setMonth(view.getMonth() - 1); drawCal(); });
  document.getElementById('calnext').addEventListener('click', function () { view.setMonth(view.getMonth() + 1); drawCal(); });
  document.getElementById('clearsample').addEventListener('click', function () {
    entries = entries.filter(function (e) { return !e.sample; }); save(); render(); drawCal(); note('sample entries removed');
  });
  function drawCal() {
    var grid = document.getElementById('calgrid');
    document.getElementById('calmonth').textContent = MONTHS[view.getMonth()] + (view.getFullYear() !== new Date().getFullYear() ? ' ' + view.getFullYear() : '');
    var has = {}; entries.forEach(function (e) { has[dkey(e.ts)] = true; });
    var tk = todayKey();
    var html = ['M','T','W','T','F','S','S'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var lead = (first.getDay() + 6) % 7;
    for (var i = 0; i < lead; i++) html += '<div class="day"></div>';
    var n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (var d = 1; d <= n; d++) {
      var k = view.getFullYear() + '-' + pad(view.getMonth() + 1) + '-' + pad(d);
      var cls = 'day' + (has[k] ? ' has' : '') + (k === tk ? ' today' : '') + (k > tk ? ' future' : '');
      html += '<button type="button" class="' + cls + '" data-day="' + k + '" aria-label="' + longDate(k) + '"><span class="n">' + d + '</span><span class="dot"></span></button>';
    }
    grid.innerHTML = html;
    document.getElementById('clearsample').hidden = !entries.some(function (e) { return e.sample; });
  }
  document.getElementById('calgrid').addEventListener('click', function (ev) {
    var b = ev.target.closest('.day'); if (!b || !b.dataset.day) return;
    var sec = page.querySelector('.daysec[data-day="' + b.dataset.day + '"]');
    if (!sec) { note('nothing written that day'); return; }
    cal.hidden = true; pinbtn.setAttribute('aria-expanded', 'false');
    var y = sec.getBoundingClientRect().top + window.scrollY - document.getElementById('pin').offsetHeight;
    window.scrollTo({ top: y, behavior: 'smooth' });
  });

  load();
  render();
  window.scrollTo(0, document.documentElement.scrollHeight);
  setTimeout(updatePin, 0);
})();
</script>
