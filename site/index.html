/* The dots. Written by `swift run --package-path design dot` from design/dots.json. Change them there. */
/* Dotto's own dot. */
:root { --own-r: 58% 42% 47% 53% / 46% 55% 45% 54%; --own-turn: -8deg; --own-w: 1.044; --own-h: 0.9578; }
/* The dots there are: a shape, a turn, and how much wider and shorter than round. */
.d1 { --r: 58% 42% 47% 53% / 46% 55% 45% 54%; --turn: -8deg; --w: 1.044; --h: 0.9578; }
.d2 { --r: 44% 56% 61% 39% / 52% 41% 59% 48%; --turn: 12deg; --w: 0.9327; --h: 1.072; }
.d3 { --r: 51% 49% 38% 62% / 60% 47% 53% 40%; --turn: 4deg; --w: 1.049; --h: 0.9535; }
.d4 { --r: 50% 50% 50% 50% / 62% 62% 38% 38%; --turn: -10deg; --w: 0.9274; --h: 1.078; }
.d5 { --r: 64% 36% 64% 36% / 40% 60% 40% 60%; --turn: 18deg; --w: 1.049; --h: 0.9535; }
.d6 { --r: 52% 48% 51% 49% / 51% 47% 53% 49%; --turn: 0deg; --w: 1; --h: 1; }
.d7 { --r: 36% 64% 52% 48% / 36% 50% 50% 64%; --turn: 30deg; --w: 1; --h: 1; }
.d8 { --r: 45% 55% 45% 55% / 50% 50% 50% 50%; --turn: -12deg; --w: 1.105; --h: 0.9054; }
.d9 { --r: 55% 45% 58% 42% / 44% 58% 42% 56%; --turn: 6deg; --w: 0.9055; --h: 1.104; }
.d10 { --r: 38% 62% 56% 44% / 58% 36% 64% 42%; --turn: -20deg; --w: 1.02; --h: 0.9806; }
.d11 { --r: 62% 38% 42% 58% / 38% 52% 48% 62%; --turn: 14deg; --w: 0.9747; --h: 1.026; }
.d12 { --r: 47% 53% 43% 57% / 34% 66% 34% 66%; --turn: 24deg; --w: 1.03; --h: 0.9713; }
/* The dots end. */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: one screen. The words stand at the left edge, read bottom up from the live line.
   The rest is a field. Every line written becomes a dot in it, its own full stop; Dotto's
   dot, the only colour, leaves the name, goes through them, and they gather into things.
   Palette: a cool near-white ground, black text, hairlines barely there.
   A person's words in a serif, the system in a grotesk, times in mono. */
:root {
  --ground: #f6f6f4;
  --text: #141618;
  --soft: #4f5357;
  --muted: #8a8f93;
  --unlit: #c6c9c9;
  --rule-strong: rgba(20, 22, 24, 0.26);
  --dot: #e4572e;
  --health: #3b5bdb;
  --words: "Newsreader", "Newsreader wait", "Iowan Old Style", Georgia, serif;
  --system: "Geist", "Geist wait", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --time: "Geist Mono", "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 0.72, 0.12, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111213; --text: #ecedea; --soft: #b4b8b5; --muted: #7e8381; --unlit: #3a3e40;
    --rule-strong: rgba(236, 237, 234, 0.28);
    --dot: #ff6a3d; --health: #7d94f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111213; --text: #ecedea; --soft: #b4b8b5; --muted: #7e8381; --unlit: #3a3e40;
  --rule-strong: rgba(236, 237, 234, 0.28);
  --dot: #ff6a3d; --health: #7d94f0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--system);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto clamp(15rem, 42svh, 24rem) auto auto;
  grid-template-areas: "mark" "field" "say" "foot";
  row-gap: 1.25rem;
  padding-block: 1.25rem 1.5rem;
  padding-left: max(clamp(16px, 4.5vw, 64px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 4.5vw, 64px), env(safe-area-inset-right, 0px));
  overflow-x: clip;
}
@media (min-width: 56rem) {
  .page {
    grid-template-columns: minmax(20rem, 34rem) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "mark field" "say field" "foot field";
    column-gap: clamp(2rem, 5vw, 5rem);
    row-gap: 2rem;
    padding-block: 2rem 2.25rem;
  }
  .note { min-height: 4.6rem; }
}

/* The name, written by hand. Its full stop is Dotto: a dot drawn by hand, its own. */
.mark {
  grid-area: mark;
  font-family: "Shantell Sans", var(--words);
  font-weight: 700;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  line-height: 1;
}
.o {
  display: inline-block;
  width: calc(10px * var(--own-w, 1)); height: calc(10px * var(--own-h, 1));
  border-radius: var(--own-r, 50%);
  transform: rotate(var(--own-turn, 0deg));
  background: var(--dot);
}
.mark .o { margin-left: 4px; }

/* The words. */
.say { grid-area: say; align-self: end; min-width: 0; display: flex; flex-direction: column; gap: 1.5rem; container-type: inline-size; }
h1 {
  margin: 0;
  font-family: var(--words);
  font-weight: 400;
  font-size: clamp(1.5rem, 8.2cqw, 3.1rem);
  line-height: 1.08;
  letter-spacing: -0.018em;
}
.ph { display: block; color: var(--unlit); transition: color 0.9s ease; }
.ph.on { color: var(--text); }

/* What a dot says, and what was done about it. */
.note { min-height: 3.4rem; display: flex; flex-direction: column; gap: 0.3rem; justify-content: flex-end; }
.note p { margin: 0; }
.said { font-family: var(--words); font-size: 1.17rem; line-height: 1.35; }
.said .t, .live .t { font-family: var(--time); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.said .t { margin-right: 0.6em; }
.said .by { font-family: var(--system); font-size: 0.78rem; color: var(--health); margin-left: 0.5em; }
.did { font-size: 0.92rem; color: var(--soft); display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 0.55rem; align-items: baseline; }
.did .o { width: calc(7px * var(--own-w, 1)); height: calc(7px * var(--own-h, 1)); transform: translateY(-1px) rotate(var(--own-turn, 0deg)); }
.hint { font-size: 0.92rem; color: var(--muted); }

/* The live line, written on its rule as on ruled paper. */
.live {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline;
  column-gap: 0.9rem;
  border-bottom: 1px solid var(--rule-strong);
  padding-bottom: 0.55rem;
}
.live input {
  min-width: 0; width: 100%;
  border: 0; outline: 0; padding: 0; margin: 0;
  background: transparent;
  color: var(--text);
  caret-color: var(--dot);
  font-family: var(--words);
  font-size: 1.3rem;
  line-height: 1.4;
}
.live input::placeholder { color: var(--muted); opacity: 1; }
.ret {
  font-family: var(--time); font-size: 0.72rem; color: var(--muted);
  background: transparent; border: 1px solid var(--rule-strong); border-radius: 6px;
  padding: 0.15rem 0.45rem; cursor: pointer;
  transition: opacity 0.2s ease;
}
.live input:placeholder-shown + .ret { opacity: 0; pointer-events: none; }
.ret:hover { color: var(--text); }
.ret:focus-visible, .foot a:focus-visible { outline: 2px solid var(--dot); outline-offset: 2px; }

/* The foot. */
.foot { grid-area: foot; font-size: 0.84rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.3rem; }
.foot p { margin: 0; }
.foot .three { color: var(--soft); }
.foot a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
.foot .addr { color: var(--soft); user-select: all; }

/* The field. */
.field { grid-area: field; position: relative; min-width: 0; min-height: 0; }
.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.links line { stroke: var(--rule-strong); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }
/* The things show in three steps: their names as they form, what they add up to, what was done. */
.links, .label, .label .n, .extra { opacity: 0; }
.links, .label { transition: opacity 0.9s ease 1.1s; }
.label .n, .extra { transition: opacity 0.8s ease; }
.field.things .links, .field.things .label { opacity: 1; }
.field.counted .label .n { opacity: 1; }
.field.done .extra { opacity: 1; }

.dot {
  position: absolute;
  left: calc(var(--x) * 100%); top: calc(var(--y) * 100%);
  width: 26px; height: 26px; margin: -13px 0 0 -13px;
  padding: 0; border: 0; border-radius: 50%;
  background: transparent; cursor: pointer;
  transition: left 1.5s var(--ease), top 1.5s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
/* Each line's dot is drawn by hand, one of the dots design/ has: its shape, its turn, and
   how much wider and shorter than round it is. */
.dot::before {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: calc(10px * var(--w, 1)); height: calc(10px * var(--h, 1));
  border-radius: var(--r, 50%);
  background: var(--text);
  transform: rotate(var(--turn, 0deg)) scale(var(--grown, 1));
  transition: transform 0.25s var(--ease);
}
.dot.health::before { background: var(--health); }
.dot:hover, .dot:focus-visible { --grown: 1.5; }
.dot:focus-visible { outline: none; }
.dot[aria-pressed="true"]::after, .dot:focus-visible::after {
  content: ""; position: absolute; inset: 1px; border-radius: 50%;
  border: 1px solid var(--text);
}
.dot.health[aria-pressed="true"]::after, .dot.health:focus-visible::after { border-color: var(--health); }
.dot.waiting { visibility: hidden; }
.dot.seen::before { animation: seen 0.8s var(--ease); }
@keyframes seen { 40% { transform: rotate(var(--turn, 0deg)) scale(1.9); } }

.label, .extra { position: absolute; left: calc(var(--x) * 100%); top: calc(var(--y) * 100%); pointer-events: none; }
.label { font-size: 0.8rem; font-weight: 500; color: var(--soft); white-space: nowrap; line-height: 1; }
.label.r { transform: translate(16px, -50%); }
.label.b { transform: translate(-5px, 15px); }
.extra { border-radius: 50%; transform: translate(-50%, -50%); }
.extra.ring { width: 24px; height: 24px; border: 1px solid var(--text); }
.extra.today { width: 10px; height: 10px; border: 1.5px solid var(--dot); }
.extra.answer {
  width: calc(7px * var(--own-w, 1)); height: calc(7px * var(--own-h, 1));
  border-radius: var(--own-r, 50%);
  transform: translate(-50%, -50%) rotate(var(--own-turn, 0deg));
  background: var(--dot);
}

/* What moves between the words and the field: a line on its way in, and Dotto on its way
   round. Each is carried by a still box and drawn inside it, so its turn does not bend its way. */
.fly { position: fixed; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none; z-index: 5; }
.fly::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: calc(10px * var(--w, 1)); height: calc(10px * var(--h, 1));
  border-radius: var(--r, 50%);
  transform: translate(-50%, -50%) rotate(var(--turn, 0deg));
  background: var(--text);
}
.fly.dotto { --r: var(--own-r, 50%); --turn: var(--own-turn, 0deg); --w: var(--own-w, 1); --h: var(--own-h, 1); }
.fly.dotto::before { background: var(--dot); }

@media (prefers-reduced-motion: reduce) {
  .dot, .dot::before, .ph, .links, .label, .label .n, .extra { transition: none; }
  .dot.seen::before { animation: none; }
}
</style>
</head>
<body>

<div class="page">
  <header class="mark"><span>dotto</span><i class="o" id="home"></i></header>

  <main class="say">
    <h1>
      <span class="ph on">Capture anything.</span>
      <span class="ph" id="p2">Dotto takes it from there.</span>
    </h1>

    <div class="note" id="note" aria-live="polite"></div>

    <form class="live" id="live" autocomplete="off">
      <label class="t" for="line" id="clock">00:00</label>
      <input id="line" name="line" type="text" aria-label="Write a line" placeholder="Write anything" enterkeyhint="done" autocapitalize="sentences" spellcheck="false" maxlength="160">
      <button class="ret" id="keep" type="submit" aria-label="Keep this line">return</button>
    </form>
  </main>

  <section class="field" id="field" aria-label="Lines written over four days. Each dot is one line.">
    <svg class="links" id="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
  </section>

  <footer class="foot">
    <p class="three">Writing costs nothing. Your words are yours. Meaning comes later.</p>
    <p>For iPhone, with a Mac at home that does the reading. By invitation for now: <span class="addr">hi@dotto.works</span></p>
    <p><a href="privacy/">Privacy</a> · November 2026</p>
  </footer>
</div>

      fig: { x: 0.14, y: 0.13, d: 0.095 }, streak: { x: 0.12, y: 0.82, d: 0.075 },
      coming: { x: 0.58, y: 0.15 }, question: { x: 0.44, y: 0.63, d: 0.06 }, walks: { x: 0.68, y: 0.50, d: 0.075 },
      spots: [[0.62, 0.84], [0.80, 0.70], [0.30, 0.50], [0.92, 0.10], [0.60, 0.32], [0.76, 0.90], [0.05, 0.60], [0.94, 0.56]]
    }
  };

  var field = document.getElementById("field");
  var links = document.getElementById("links");
  var note = document.getElementById("note");
  var form = document.getElementById("live");
  var input = document.getElementById("line");
  var clock = document.getElementById("clock");
  var home = document.getElementById("home");
  var wideQuery = window.matchMedia("(min-width: 56rem)");
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var gathered = false;   // the things have formed
  var settled = false;    // the piece has played; from here a new line is read as it lands
  var taken = false;      // the visitor has taken the live line
  var busy = Promise.resolve();
  var pinned = null;
  var mine = 0;
  var dots = {};
  var marks = [];

  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function wait(ms) { return new Promise(function (done) { setTimeout(done, ms); }); }
  function at(node, x, y) { node.style.setProperty("--x", x); node.style.setProperty("--y", y); }
  function centre(node) { var r = node.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  // A dot is a button: touch it and it says its line. Each is one of the dots this page's style has,
  // from the second on; the first is Dotto's own.
  var drawn = 0;
  function makeDot(line) {
    var b = el("button", "dot" + (line.by ? " health" : ""));
    b.shape = "d" + (2 + drawn++ % 11);
    b.classList.add(b.shape);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", line.t + ". " + line.w + (line.by ? " Written by " + line.by + "." : ""));
    b.line = line;
    b.addEventListener("click", function () { pin(pinned === b ? null : b); });
    b.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") say(b); });
    b.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") say(pinned); });
    b.addEventListener("focus", function () { say(b); });
    b.addEventListener("blur", function () { say(pinned); });
    field.appendChild(b);
    dots[line.id] = b;
    return b;
  }

  function pin(b) {
    if (pinned) pinned.setAttribute("aria-pressed", "false");
    pinned = b;
    if (b) b.setAttribute("aria-pressed", "true");
    say(b);
  }

  function say(b) {
    note.textContent = "";
    if (!b) {
      if (settled) { var h = el("p", "hint"); h.textContent = "Each dot is a line. Touch one."; note.appendChild(h); }
      return;
    }
    var line = b.line;
    var said = el("p", "said");
    var t = el("span", "t"); t.textContent = line.t; said.appendChild(t);
    said.appendChild(document.createTextNode(line.w));
    if (line.by) { var by = el("span", "by"); by.textContent = line.by; said.appendChild(by); }
    note.appendChild(said);
    if (gathered && line.read !== false) {
      var did = el("p", "did");
      did.appendChild(el("i", "o"));
      var words = el("span"); words.textContent = line.mine ? YOURS : (DID[line.thing] || NOTHING);
      did.appendChild(words);
      note.appendChild(did);
    }
  }

  // Where the lines stand, for the field as it is now.
  function place() {
    var T = THINGS[wideQuery.matches ? "wide" : "narrow"];
    var order = { fig: 0, streak: 0, walks: 0 };
    LINES.forEach(function (line) {
      var p = SCATTER[line.id];
      if (gathered && line.thing) {
        var g = T[line.thing];
        if (line.thing === "fig") p = [g.x, g.y + g.d * order.fig++];
        else if (line.thing === "streak") p = [g.x + g.d * order.streak++, g.y];
        else if (line.thing === "walks") p = [g.x + g.d * order.walks++, g.y];
        else p = [g.x, g.y];
      }
      at(dots[line.id], p[0], p[1]);
    });
    field.classList.toggle("things", gathered);
  }

  // What stands beside the things once they have formed: their names, a ring, a thread.
  // Made when the page opens and when the field changes shape, shown when the things form.
  function build() {
    var T = THINGS[wideQuery.matches ? "wide" : "narrow"];
    marks.forEach(function (m) { m.remove(); });
    marks = [];
    links.textContent = "";
    function mark(cls, x, y, text, sum) {
      var m = el("span", cls); if (text) m.textContent = text;
      if (sum) { var n = el("span", "n"); n.textContent = " · " + sum; m.appendChild(n); }
      at(m, x, y); field.appendChild(m); marks.push(m);
    }
    function link(x1, y1, x2, y2) {
      var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", x1 * 100); l.setAttribute("y1", y1 * 100);
      l.setAttribute("x2", x2 * 100); l.setAttribute("y2", y2 * 100);
      links.appendChild(l);
    }
    var f = T.fig, s = T.streak, c = T.coming, q = T.question, w = T.walks;
    link(f.x, f.y, f.x, f.y + f.d * 2);
    mark("label r", f.x, f.y, "The fig", "3 lines");
    link(s.x, s.y, s.x + s.d * 3, s.y);
    mark("extra today", s.x + s.d * 3, s.y);
    mark("label b", s.x, s.y, "No scrolling", "3 days");
    mark("extra ring", c.x, c.y);
    mark("label r", c.x, c.y, "Thursday 10:30");
    link(q.x, q.y, q.x + q.d, q.y);
    mark("extra answer", q.x + q.d, q.y);
    link(w.x, w.y, w.x + w.d, w.y);
    mark("label b", w.x, w.y, "Walks", "7.3 km");
  }

  // One thing moving over the page from one point to another.
  function fly(cls, from, to, ms, ease) {
    var f = el("i", "fly " + cls);
    document.body.appendChild(f);
    var a = f.animate(
      [{ transform: "translate(" + from[0] + "px," + from[1] + "px)" }, { transform: "translate(" + to[0] + "px," + to[1] + "px)" }],
      { duration: ms, easing: ease || "cubic-bezier(0.3, 0, 0.15, 1)", fill: "forwards" }
    );
    return a.finished.then(function () { return f; }, function () { return f; });
  }

  // Return: the words become their full stop, and the full stop goes to its place.
  function end() {
    var r = input.getBoundingClientRect();
    var ctx = document.createElement("canvas").getContext("2d");
    var cs = getComputedStyle(input);
    ctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    var w = Math.min(ctx.measureText(input.value).width, r.width - 6);
    return [r.left + w + 6, r.top + r.height * 0.62];
  }
  function land(b) {
    if (still) { b.classList.remove("waiting"); input.value = ""; return Promise.resolve(); }
    var from = end();
    input.value = "";
    return fly("line " + b.shape, from, centre(b), 850).then(function (f) { b.classList.remove("waiting"); f.remove(); });
  }

  // Dotto leaves the name, goes to each line in turn, stays a moment with each, and comes
  // home. Without hurry: it is reading.
  function read(list) {
    if (still || !list.length) return Promise.resolve();
    var here = centre(home);
    home.style.visibility = "hidden";
    var chain = Promise.resolve();
    list.concat([null]).forEach(function (b, i) {
      chain = chain.then(function () {
        var there = b ? centre(b) : centre(home);
        var first = i === 0, last = b === null;
        return fly("dotto", here, there, first || last ? 900 : 480, first || last ? null : "cubic-bezier(0.45, 0, 0.25, 1)").then(function (f) {
          here = there;
          if (b) pulse(b);
          return (b ? wait(260) : Promise.resolve()).then(function () { f.remove(); });
        });
      });
    });
    return chain.then(function () { home.style.visibility = ""; });
  }

  function pulse(b) { b.classList.remove("seen"); void b.offsetWidth; b.classList.add("seen"); }
  function light(id) { document.getElementById(id).classList.add("on"); }

  // What each line is: the lines of one thing answer together, one thing after another.
  function identify() {
    var chain = Promise.resolve();
    ["fig", "streak", "coming", "question", "walks"].forEach(function (thing) {
      chain = chain.then(function () {
        LINES.forEach(function (l) { if (l.thing === thing) pulse(dots[l.id]); });
        return wait(520);
      });
    });
    return chain.then(function () { return wait(300); });
  }

  // The piece: the last line is written, then Dotto takes it from there, a step at a time.
  function play() {
    var last = dots.a13;
    if (still) {
      last.classList.remove("waiting");
      light("p2");
      gathered = true; settled = true; place(); field.classList.add("counted", "done"); say(null);
      return Promise.resolve();
    }
    return wait(900)
      .then(function () {
        var text = last.line.w, i = 0;
        function key() {
          if (taken) { last.classList.remove("waiting"); return Promise.resolve(); }
          if (i === text.length) return wait(420).then(function () { return taken ? (last.classList.remove("waiting"), null) : land(last); });
          input.value = text.slice(0, ++i);
          return wait(34 + Math.random() * 46).then(key);
        }
        return key();
      })
      .then(function () { return wait(500); })
      .then(function () { light("p2"); return read(LINES.map(function (l) { return dots[l.id]; })); })
      .then(identify)
      .then(function () { gathered = true; place(); return wait(2200); })
      .then(function () { field.classList.add("counted"); return wait(1000); })
      .then(function () { field.classList.add("done"); return wait(1100); })
      .then(function () { settled = true; if (!pinned) say(null); });
  }

  // A line of the visitor's own. It lands, is read, and stays on this page.
  function keep(text) {
    var now = new Date();
    var line = { id: "m" + (++mine), t: now.toLocaleDateString("en-GB", { weekday: "short" }) + " " + hhmm(now), w: text, mine: true, read: false };
    var b = makeDot(line);
    var spots = THINGS[wideQuery.matches ? "wide" : "narrow"].spots;
    var spot = spots[(mine - 1) % spots.length], lap = Math.floor((mine - 1) / spots.length);
    at(b, Math.min(0.96, Math.max(0.04, spot[0] + lap * 0.03)), Math.min(0.96, Math.max(0.04, spot[1] - lap * 0.035)));
    b.classList.add("waiting");
    land(b).then(function () {
      if (!settled) { pending.push(b); return; }
      busy = busy.then(function () { return read([b]); }).then(function () { line.read = true; pin(b); });
    });
  }
  var pending = [];

  function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function tick() { clock.textContent = hhmm(new Date()); }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !taken) return;
    keep(text);
  });
  // The live line is the visitor's from the moment they come to it.
  function take() {
    if (taken) return;
    taken = true;
    if (!settled) input.value = "";
  }
  input.addEventListener("focus", take);
  input.addEventListener("pointerdown", take);

  LINES.forEach(makeDot);
  dots.a13.classList.add("waiting");
  build();
  place();
  tick(); setInterval(tick, 15000);
  if (wideQuery.addEventListener) wideQuery.addEventListener("change", function () { build(); place(); });

  busy = play().then(function () {
    // Lines the visitor wrote while the piece was playing are read now.
    var list = pending.splice(0);
    return read(list).then(function () {
      list.forEach(function (b) { b.line.read = true; });
      if (list.length) pin(list[list.length - 1]);
    });
  });
})();
</script>

</body>
</html>
